<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Image Scrap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Newsreader:opsz,wght@6..72,300&display=swap">
<style>
/* Layout: one white stage. Header, an upload zone that becomes the picture, and a floor line with Scrap / Restore. Torn pieces fall onto the line like leaves. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: #000; color: #fff; }

.stage {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  overflow: hidden;
}
.g {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding-block: 22px 0;
}
.name { font: 300 22px/1 var(--serif); letter-spacing: 0.01em; }
.brand { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; min-width: 0; }
.home {
  font: 300 11px/1 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #000;
  text-decoration: none;
  border-bottom: 1px solid #000;
  padding-bottom: 4px;
}
.home:hover { background: #000; color: #fff; }
.home:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
.hint {
  font: 300 11px/1.4 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: right;
}

.field {
  --top: clamp(32px, 8vh, 96px);
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: var(--top);
}
.drop {
  box-sizing: border-box;
  width: min(720px, 100%);
  padding: clamp(28px, 6vh, 56px) 24px;
  border: 1px dashed #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  text-align: center;
  cursor: pointer;
}
.drop[hidden], .ghost[hidden], .hint[hidden] { display: none !important; }
.drop .big { font: 300 clamp(24px, 4.2vw, 38px)/1.3 var(--serif); text-wrap: balance; }
.drop .small {
  font: 300 11px/1.6 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.drop .msg {
  min-height: 1.6em;
  font: 300 11px/1.6 var(--mono);
  letter-spacing: 0.1em;
}
.stage.drag .drop { background: #000; color: #fff; border-style: solid; }
.stage.drag .drop .btn { background: #fff; color: #000; border-color: #fff; }
.drop:focus-visible { outline: 2px solid #000; outline-offset: 4px; }

.cv {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 2;
  pointer-events: none;
}

.floor {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  min-height: 76px;
  background: var(--paper);
}
.floor::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: #000;
  transform-origin: right center;
  transform: scaleX(var(--line, 1));
}
.floor.redraw::before {
  transform-origin: left center;
  transition: transform 0.55s ease-out;
}
.count {
  min-width: 0;
  font: 300 11px/1.5 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.btn {
  font: 400 12px/1 var(--mono);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: #000;
  color: #fff;
  border: 1px solid #000;
  border-radius: 0;
  padding: 18px 34px;
  min-width: 170px;
  cursor: pointer;
}
.pair { display: flex; justify-content: center; gap: 10px; }
.btn.alt { background: #fff; color: #000; }
.btn.alt:hover:not(:disabled) { background: #000; color: #fff; }
.btn:hover:not(:disabled) { background: #fff; color: #000; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { background: #fff; color: #000; border-style: dashed; cursor: default; }
.ghost {
  justify-self: end;
  font: 300 11px/1 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: none;
  color: #000;
  border: 0;
  border-bottom: 1px solid #000;
  border-radius: 0;
  padding: 6px 0;
  cursor: pointer;
}
.ghost:hover:not(:disabled) { background: #000; color: #fff; }
.ghost:disabled { border-bottom-style: dashed; cursor: default; }
.btn:focus-visible, .ghost:focus-visible { outline: 2px solid #000; outline-offset: 3px; }

@media (max-width: 760px) {
  .floor {
    grid-template-columns: 1fr auto;
    grid-template-areas: "pair pair" "count sweep";
    row-gap: 14px;
    padding-block: 14px;
  }
  .pair { grid-area: pair; }
  .count { grid-area: count; }
  .floor .ghost { grid-area: sweep; }
  .btn { min-width: 0; flex: 1; padding: 16px 18px; }
  .count, .floor .ghost { font-size: 10px; letter-spacing: 0.1em; }
}
@media (max-width: 560px) {
  .hint { display: none; }
}
</style>

</head><body><div class="stage" id="stage">
  <header class="top g">
    <div class="brand"><a class="home" href="index.html">&larr; Welcome</a><span class="name">Image Scrap</span></div>
    <div>
      <span class="hint" id="hint">Drop an image, scrap it, watch it fall.</span>
      <button class="ghost" id="change" type="button" hidden>Change image</button>
    </div>
  </header>

  <main class="field g" id="field">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an image">
      <div class="big">Drop an image here.</div>
      <div class="small">PNG &middot; JPG &middot; SVG &middot; WebP &middot; GIF &middot; up to 10 MB</div>
      <button class="btn" id="pick" type="button">Choose image</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </main>

  <canvas class="cv" id="cv" aria-hidden="true"></canvas>

  <footer class="floor g" id="floor">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="pair">
      <button class="btn" id="scrap" type="button" title="Tear the image into pieces and let them fall">Scrap &darr;</button>
      <button class="btn alt" id="restore" type="button" title="Gather the pieces back into the image">Restore &uarr;</button>
    </div>
    <button class="ghost" id="sweep" type="button">Sweep away</button>
  </footer>

  <input type="file" id="file" accept="image/*,.svg" hidden>
</div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d'), field = $('field'), drop = $('drop');
  var fileIn = $('file'), btnPick = $('pick'), btnS = $('scrap'), btnR = $('restore'), btnW = $('sweep');
  var btnX = $('change'), hint = $('hint'), count = $('count'), floorEl = $('floor'), msgEl = $('msg');

  var MAX_BYTES = 10 * 1024 * 1024, PRE = 520, GAP = 1.1;
  var dpr = 1, W = 0, H = 0, floorY = 0;
  var mode = 'none';      // none | intact | pile | mended
  var state = 'idle';     // idle | pre | falling | reversing | sweeping
  var src = null, srcUrl = '', srcNW = 0, srcNH = 0, seed = 7;
  var rect = { x: 0, y: 0, w: 0, h: 0 }, base = null, baseAlpha = 0, fromIntact = false;
  var pieces = [], seq = 0, maxR = 20, uid = 0;
  var tState = 0, sweepDur = 0, openEdge = -1e9, flashTimer = 0;
  var ptr = { x: 0, y: 0, lx: 0, ly: 0, on: false }, R = 70;
  var last = performance.now();
  var GRAV = 1500;

  /* ---------- sizing ---------- */
  function resize() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    floorY = H - floorEl.offsetHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    dirty = true;
    R = W < 560 ? 52 : 70;
  }

  function computeRect() {
    var sr = stage.getBoundingClientRect(), fr = field.getBoundingClientRect(), cs = getComputedStyle(field);
    var aw = fr.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var ah = fr.height - 64;
    var s = Math.min(aw / srcNW, ah / srcNH, 1000 / srcNW, 2);
    if (!(s > 0)) s = 0.1;
    var dw = Math.max(60, Math.round(srcNW * s)), dh = Math.max(60, Math.round(srcNH * s));
    rect.w = dw;
    rect.h = dh;
    rect.x = Math.round((W - dw) / 2);
    rect.y = Math.round(fr.top - sr.top + (fr.height - dh) / 2);
  }

  /* ---------- shard geometry ---------- */
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clip(poly, a, b, c) {
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      var dp = a * p[0] + b * p[1] - c, dq = a * q[0] + b * q[1] - c;
      if (dp <= 0) out.push(p);
      if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
        var t = dp / (dp - dq);
        out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
      }
    }
    return out;
  }
  function signedArea(poly) {
    var s = 0;
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      s += p[0] * q[1] - q[0] * p[1];
    }
    return s / 2;
  }
  function inset(poly, g, dw, dh) {
    var n = poly.length, sgn = signedArea(poly) >= 0 ? 1 : -1, out = poly.slice(), e = 0.01;
    for (var i = 0; i < n; i++) {
      var p = poly[i], q = poly[(i + 1) % n];
      var onEdge = (Math.abs(p[0]) < e && Math.abs(q[0]) < e) || (Math.abs(p[0] - dw) < e && Math.abs(q[0] - dw) < e) ||
                   (Math.abs(p[1]) < e && Math.abs(q[1]) < e) || (Math.abs(p[1] - dh) < e && Math.abs(q[1] - dh) < e);
      if (onEdge) continue;
      var ex = q[0] - p[0], ey = q[1] - p[1], len = Math.sqrt(ex * ex + ey * ey);
      if (len < 1e-6) continue;
      var nx = -ey / len * sgn, ny = ex / len * sgn;
      out = clip(out, -nx, -ny, -(nx * p[0] + ny * p[1]) - g / 2);
      if (out.length < 3) return null;
    }
    return out;
  }

  function buildPieces() {
    var dw = rect.w, dh = rect.h;
    base = document.createElement('canvas');
    base.width = Math.round(dw * dpr);
    base.height = Math.round(dh * dpr);
    var bx = base.getContext('2d');
    bx.imageSmoothingQuality = 'high';
    bx.drawImage(src, 0, 0, base.width, base.height);

    var target = W < 560 ? 460 : 840;
    var cell = Math.sqrt(dw * dh / target);
    var cols = Math.max(2, Math.round(dw / cell)), rows = Math.max(2, Math.round(dh / cell));
    var cw = dw / cols, ch = dh / rows, rnd = mulberry(seed);
    var sites = [], i, j, k;
    for (j = 0; j < rows; j++) {
      for (i = 0; i < cols; i++) {
        sites.push({ x: (i + 0.5 + (rnd() - 0.5) * 0.8) * cw, y: (j + 0.5 + (rnd() - 0.5) * 0.8) * ch, i: i, j: j });
      }
    }
    pieces = [];
    maxR = 10;
    for (k = 0; k < sites.length; k++) {
      var s = sites[k], poly = [[0, 0], [dw, 0], [dw, dh], [0, dh]];
      for (var dj = -3; dj <= 3 && poly.length >= 3; dj++) {
        for (var di = -3; di <= 3; di++) {
          if (!di && !dj) continue;
          var ni = s.i + di, nj = s.j + dj;
          if (ni < 0 || nj < 0 || ni >= cols || nj >= rows) continue;
          var o = sites[nj * cols + ni];
          poly = clip(poly, o.x - s.x, o.y - s.y, ((o.x * o.x + o.y * o.y) - (s.x * s.x + s.y * s.y)) / 2);
          if (poly.length < 3) break;
        }
      }
      if (poly.length < 3) continue;
      var area = signedArea(poly);
      if (Math.abs(area) < 6) continue;
      var cxs = 0, cys = 0, n = poly.length;
      for (i = 0; i < n; i++) {
        var p = poly[i], q = poly[(i + 1) % n], cr = p[0] * q[1] - q[0] * p[1];
        cxs += (p[0] + q[0]) * cr;
        cys += (p[1] + q[1]) * cr;
      }
      var cx = cxs / (6 * area), cy = cys / (6 * area);
      var ip = inset(poly, GAP, dw, dh);
      if (!ip) continue;
      var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
      ip.forEach(function (v) {
        if (v[0] < minx) minx = v[0];
        if (v[1] < miny) miny = v[1];
        if (v[0] > maxx) maxx = v[0];
        if (v[1] > maxy) maxy = v[1];
      });
      var sx0 = Math.floor((minx - 2) * dpr) / dpr, sy0 = Math.floor((miny - 2) * dpr) / dpr;
      var spr = document.createElement('canvas');
      spr.width = Math.ceil((maxx + 2 - sx0) * dpr);
      spr.height = Math.ceil((maxy + 2 - sy0) * dpr);
      var sc = spr.getContext('2d');
      sc.drawImage(base, sx0 * dpr, sy0 * dpr, spr.width, spr.height, 0, 0, spr.width, spr.height);
      sc.globalCompositeOperation = 'destination-in';
      sc.beginPath();
      ip.forEach(function (v, idx) {
        var x = (v[0] - sx0) * dpr, y = (v[1] - sy0) * dpr;
        if (idx) sc.lineTo(x, y); else sc.moveTo(x, y);
      });
      sc.closePath();
      sc.fillStyle = '#000';
      sc.fill();
      sc.globalCompositeOperation = 'source-over';
      sc.lineWidth = 1.2 * dpr;
      sc.lineJoin = 'round';
      sc.strokeStyle = '#fff';
      sc.stroke();

      var rad = 0.62 * Math.sqrt(Math.abs(area) / Math.PI);
      if (rad > maxR) maxR = rad;
      pieces.push({
        id: uid++, spr: spr, sw: spr.width / dpr, sh: spr.height / dpr,
        ax: cx - sx0, ay: cy - sy0,
        hx: rect.x + cx, hy: rect.y + cy, r: rad,
        x: rect.x + cx, y: rect.y + cy, a: 0, fs: 1, vx: 0, vy: 0, va: 0,
        st: 'home', z: 0, asleep: false, sleepT: 0, rel: 0
      });
    }
  }

  /* ---------- messages and ui ---------- */
  function flash(msg) {
    count.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { flashTimer = 0; ui(); }, 2600);
  }
  function say(msg) {
    if (!drop.hidden) { msgEl.textContent = msg; } else { flash(msg); }
  }
  function ui() {
    var has = mode !== 'none', idle = state === 'idle';
    btnS.disabled = !(idle && (mode === 'intact' || mode === 'mended'));
    btnR.disabled = !(idle && mode === 'pile');
    btnW.disabled = !(idle && mode === 'pile');
    btnX.disabled = !idle;
    btnX.hidden = !has;
    hint.hidden = has;
    drop.hidden = has;
    if (flashTimer) return;
    var n = pieces.length, t;
    if (state === 'pre' || state === 'falling') t = 'Scrapping';
    else if (state === 'reversing') t = 'Restoring';
    else if (state === 'sweeping') t = 'Sweeping';
    else if (mode === 'none') t = 'No image yet';
    else if (mode === 'intact') t = n + ' pieces ready';
    else if (mode === 'pile') t = n + ' pieces resting';
    else t = n + ' pieces, mended';
    count.textContent = t;
  }

  /* ---------- loading ---------- */
  function loadFile(file) {
    if (!file) return;
    var okType = /^image\//.test(file.type) || /\.(png|jpe?g|gif|webp|bmp|svg|avif|ico|tiff?|heic|heif)$/i.test(file.name);
    if (!okType) { say('That is not an image file.'); return; }
    if (file.size > MAX_BYTES) { say('That file is ' + (file.size / 1048576).toFixed(1) + ' MB. The limit is 10 MB.'); return; }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      if (srcUrl) URL.revokeObjectURL(srcUrl);
      srcUrl = url;
      setImage(img, img.naturalWidth || 1000, img.naturalHeight || 750);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      say(/heic|heif/i.test(file.name + file.type)
        ? 'HEIC photos cannot be read here. Save the photo as JPG first.'
        : 'Your browser could not read that image.');
    };
    img.src = url;
  }
  function setImage(img, nw, nh) {
    pieces = [];
    base = null;
    src = img;
    srcNW = nw;
    srcNH = nh;
    seed = (Math.random() * 1e9) | 0;
    openEdge = -1e9;
    seq = 0;
    state = 'idle';
    mode = 'intact';
    baseAlpha = 1;
    msgEl.textContent = '';
    drop.hidden = true;
    computeRect();
    buildPieces();
    ui();
  }

  /* ---------- scrap ---------- */
  function scrap() {
    if (state !== 'idle' || !(mode === 'intact' || mode === 'mended')) return;
    fromIntact = mode === 'intact';
    if (!fromIntact) baseAlpha = 0;
    mode = 'pile';
    state = 'pre';
    tState = performance.now();
    pieces.forEach(function (p) {
      p.st = 'home'; p.z = 0; p.x = p.hx; p.y = p.hy; p.a = 0; p.fs = 1;
      p.vx = p.vy = p.va = 0; p.asleep = false; p.sleepT = 0;
      p.rel = tState + PRE + ((rect.y + rect.h - p.hy) / rect.h) * 2600 + ((p.hx - rect.x) / rect.w) * 260 + Math.random() * 380;
    });
    ui();
  }
  function launch(p, now) {
    p.st = 'air';
    p.z = 1e6 + p.id;
    p.t0 = now; p.xb = p.x; p.yb = p.y; p.a0 = p.a; p.vyF = 0; p.vxF = 0;
    p.A = 28 + Math.random() * 52;
    p.w = 1.0 + Math.random() * 1.3;
    p.ph = Math.random() * 6.283;
    p.ph2 = Math.random() * 6.283;
    p.drift = (Math.random() - 0.5) * 36;
    p.vt = 120 + Math.random() * 90;
    p.fw = 0.7 + Math.random() * 1.0;
    p.fph = Math.random() * 6.283;
    p.spin = (Math.random() - 0.5) * 0.5;
  }
  function flight(p, dt, now) {
    var t = (now - p.t0) / 1000, r = Math.min(t / 1.2, 1);
    r = r * r * (3 - 2 * r);
    var ox = p.x;
    var target = p.vt * (1 + 0.3 * Math.sin(2 * p.w * t + p.ph2) * r);
    p.vyF += (target - p.vyF) * Math.min(1, 2.4 * dt);
    p.yb += p.vyF * dt;
    p.xb += p.drift * r * dt;
    p.x = p.xb + p.A * r * Math.sin(p.w * t + p.ph);
    p.y = p.yb;
    if (p.x < p.r) { p.xb += p.r - p.x; p.x = p.r; }
    else if (p.x > W - p.r) { p.xb -= p.x - (W - p.r); p.x = W - p.r; }
    p.a = p.a0 + r * (0.8 * Math.cos(p.w * t + p.ph) + p.spin * Math.min(t, 5) * 0.5);
    var c = Math.cos(p.fw * t + p.fph);
    p.fs = 1 - r * (1 - (0.18 + 0.82 * Math.sqrt(0.05 + 0.95 * c * c)));
    p.vxF = (p.x - ox) / dt;
  }
  function land(p) {
    p.st = 'rest';
    p.vx = p.vxF * 0.3;
    p.vy = Math.min(p.vyF, 220) * 0.3;
    p.va = (Math.random() - 0.5) * 0.8;
    p.seq = ++seq;
    p.z = p.seq;
    p.asleep = false;
    p.sleepT = 0;
  }

  /* ---------- physics for pieces in the pile ---------- */
  var gcell = 40;
  function gkey(x, y) { return (Math.floor(x / gcell) + 64) * 2048 + (Math.floor(y / gcell) + 64); }
  function buildGrid(list) {
    var g = new Map();
    for (var i = 0; i < list.length; i++) {
      var k = gkey(list[i].x, list[i].y), a = g.get(k);
      if (a) a.push(list[i]); else g.set(k, [list[i]]);
    }
    return g;
  }
  function floorHere(p) { return p.x >= openEdge; }

  function physics(dt, now) {
    var i, j, p, q, it;
    gcell = Math.max(24, maxR * 2 + 2);
    var rest = [], air = [];
    for (i = 0; i < pieces.length; i++) {
      p = pieces[i];
      if (p.st === 'rest') rest.push(p); else if (p.st === 'air') air.push(p);
    }
    if (air.length) {
      var rg = buildGrid(rest);
      for (i = 0; i < air.length; i++) {
        p = air[i];
        flight(p, dt, now);
        var ar = p.r * 0.85, hit = false;
        if (floorHere(p) && p.y + ar >= floorY) { p.y = floorY - ar; hit = true; }
        if (!hit) {
          var cxk = Math.floor(p.x / gcell), cyk = Math.floor(p.y / gcell);
          for (var dx = -1; dx <= 1 && !hit; dx++) {
            for (var dy = -1; dy <= 1 && !hit; dy++) {
              var arr = rg.get((cxk + dx + 64) * 2048 + (cyk + dy + 64));
              if (!arr) continue;
              for (j = 0; j < arr.length; j++) {
                q = arr[j];
                var ddx = q.x - p.x, ddy = q.y - p.y, rr = ar + q.r * 0.9;
                if (ddx * ddx + ddy * ddy < rr * rr) { hit = true; break; }
              }
            }
          }
        }
        if (hit) { land(p); rest.push(p); }
      }
    }
    if (!rest.length) return;
    var anyAwake = false;
    for (i = 0; i < rest.length; i++) if (!rest[i].asleep) { anyAwake = true; break; }
    if (!anyAwake) return;

    var sub = 2, sdt = dt / sub;
    for (var s = 0; s < sub; s++) {
      for (i = 0; i < rest.length; i++) {
        p = rest[i];
        p.fs += (1 - p.fs) * Math.min(1, 10 * sdt);
        if (p.asleep) continue;
        p.vy += GRAV * sdt;
        var d = Math.max(0, 1 - 0.6 * sdt);
        p.vx *= d;
        p.x += p.vx * sdt;
        p.y += p.vy * sdt;
        p.a += p.va * sdt;
        p.va *= Math.max(0, 1 - 3 * sdt);
      }
      var g = buildGrid(rest);
      for (it = 0; it < 2; it++) {
        for (i = 0; i < rest.length; i++) {
          p = rest[i];
          if (p.asleep) continue;
          var kx = Math.floor(p.x / gcell), ky = Math.floor(p.y / gcell);
          for (var ox = -1; ox <= 1; ox++) {
            for (var oy = -1; oy <= 1; oy++) {
              var cell = g.get((kx + ox + 64) * 2048 + (ky + oy + 64));
              if (!cell) continue;
              for (j = 0; j < cell.length; j++) {
                q = cell[j];
                if (q === p || (!q.asleep && q.id < p.id)) continue;
                var dx2 = q.x - p.x, dy2 = q.y - p.y, d2 = dx2 * dx2 + dy2 * dy2, rr2 = p.r + q.r;
                if (d2 >= rr2 * rr2 || d2 === 0) continue;
                var dist = Math.sqrt(d2), nx = dx2 / dist, ny = dy2 / dist, pen = rr2 - dist;
                var wa = p.asleep ? 0 : 1, wb = q.asleep ? 0 : 1, ws = wa + wb;
                if (ws === 0) continue;
                var corr = pen * 0.55;
                p.x -= nx * corr * wa / ws; p.y -= ny * corr * wa / ws;
                q.x += nx * corr * wb / ws; q.y += ny * corr * wb / ws;
                var rvx = q.vx - p.vx, rvy = q.vy - p.vy, vn = rvx * nx + rvy * ny;
                if (vn < 0) {
                  if (vn < -70) { p.asleep = false; q.asleep = false; p.sleepT = 0; q.sleepT = 0; wa = 1; wb = 1; ws = 2; }
                  var jn = -(1.04) * vn / ws;
                  p.vx -= jn * nx * wa; p.vy -= jn * ny * wa;
                  q.vx += jn * nx * wb; q.vy += jn * ny * wb;
                  var tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, jt = -vt * 0.35 / ws;
                  p.vx -= jt * tx * wa; p.vy -= jt * ty * wa;
                  q.vx += jt * tx * wb; q.vy += jt * ty * wb;
                }
              }
            }
          }
        }
        for (i = 0; i < rest.length; i++) {
          p = rest[i];
          if (p.asleep) continue;
          if (floorHere(p) && p.y + p.r > floorY) {
            p.y = floorY - p.r;
            if (p.vy > 0) p.vy = p.vy > 120 ? -p.vy * 0.1 : 0;
            p.vx *= Math.max(0, 1 - 10 * sdt);
          }
          if (p.x < p.r) { p.x = p.r; if (p.vx < 0) p.vx *= -0.1; }
          else if (p.x > W - p.r) { p.x = W - p.r; if (p.vx > 0) p.vx *= -0.1; }
        }
      }
      for (i = 0; i < rest.length; i++) {
        p = rest[i];
        if (p.asleep) continue;
        var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp < 110 && state !== 'sweeping') {
          p.sleepT += sdt;
          p.vx *= 0.88;
          p.vy *= 0.88;
          p.va *= 0.8;
        } else p.sleepT = 0;
        if (p.sleepT > 0.3) { p.asleep = true; p.vx = p.vy = p.va = 0; }
      }
    }
  }

  /* ---------- restore ---------- */
  function ease(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }
  var revT0 = 0;
  function restore() {
    if (state !== 'idle' || mode !== 'pile') return;
    var arr = pieces.slice().sort(function (a, b) { return a.y - b.y; });
    arr.forEach(function (p, i) {
      p.st = 'back';
      p.asleep = false;
      p.sx = p.x; p.sy = p.y; p.sf = p.fs;
      var a = p.a % (2 * Math.PI);
      if (a > Math.PI) a -= 2 * Math.PI;
      if (a < -Math.PI) a += 2 * Math.PI;
      p.sa = a;
      var dx = p.hx - p.sx, dy = p.hy - p.sy, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var arc = (Math.random() - 0.5) * Math.min(240, len * 0.6);
      p.px = -dy / len * arc;
      p.py = dx / len * arc;
      p.rd = (i / arr.length) * 1000 + Math.random() * 220;
      p.rdur = 1200 + Math.random() * 500;
      p.lift = false;
    });
    revT0 = performance.now();
    state = 'reversing';
    ui();
  }

  /* ---------- sweep ---------- */
  function sweep() {
    if (state !== 'idle' || mode !== 'pile') return;
    state = 'sweeping';
    tState = performance.now();
    sweepDur = Math.max(1500, Math.min(3000, W * 1.5));
    floorEl.classList.remove('redraw');
    ui();
  }

  /* ---------- frame ---------- */
  function update(dt, now) {
    var i, p;
    if (state === 'pre') {
      var k = Math.min((now - tState) / PRE, 1), ke = k * k * (3 - 2 * k);
      if (fromIntact) baseAlpha = 1 - ke;
      for (i = 0; i < pieces.length; i++) {
        p = pieces[i];
        p.x = p.hx + (Math.random() - 0.5) * 1.2 * k;
        p.y = p.hy + (Math.random() - 0.5) * 1.2 * k;
      }
      if (k >= 1) {
        for (i = 0; i < pieces.length; i++) { pieces[i].x = pieces[i].hx; pieces[i].y = pieces[i].hy; }
        baseAlpha = 0;
        state = 'falling';
      }
    }
    if (state === 'falling') {
      var pending = false;
      for (i = 0; i < pieces.length; i++) {
        p = pieces[i];
        if (p.st === 'home') { pending = true; if (now >= p.rel) launch(p, now); }
      }
      if (!pending) {
        var flying = false;
        for (i = 0; i < pieces.length; i++) if (pieces[i].st === 'air') { flying = true; break; }
        if (!flying) { state = 'idle'; ui(); }
      }
    }

    if (ptr.on && mode === 'pile' && state !== 'reversing') brush(dt);
    ptr.lx = ptr.x;
    ptr.ly = ptr.y;

    if (mode === 'pile' && state !== 'reversing') physics(dt, now);

    if (state === 'reversing') {
      var t = now - revT0, done = true;
      for (i = 0; i < pieces.length; i++) {
        p = pieces[i];
        var u = (t - p.rd) / p.rdur;
        if (u < 1) done = false;
        if (u <= 0) continue;
        if (!p.lift) { p.lift = true; p.z = 2e6 + p.id; }
        var e = ease(Math.min(u, 1)), s = Math.sin(Math.PI * e);
        p.x = p.sx + (p.hx - p.sx) * e + p.px * s;
        p.y = p.sy + (p.hy - p.sy) * e + p.py * s;
        p.a = p.sa * (1 - e);
        p.fs = p.sf + (1 - p.sf) * e;
      }
      if (done) {
        for (i = 0; i < pieces.length; i++) {
          p = pieces[i];
          p.st = 'home'; p.z = 0; p.x = p.hx; p.y = p.hy; p.a = 0; p.fs = 1; p.vx = p.vy = p.va = 0;
        }
        mode = 'mended';
        state = 'idle';
        ui();
      }
    }

    if (state === 'sweeping') {
      var sp = Math.min((now - tState) / sweepDur, 1);
      floorEl.style.setProperty('--line', (1 - sp).toFixed(4));
      openEdge = sp >= 1 ? W + 1000 : sp * W;
      for (i = 0; i < pieces.length; i++) {
        p = pieces[i];
        if (p.st === 'rest' && p.x < openEdge + p.r * 1.5) {
          if (p.asleep) {
            p.asleep = false;
            p.vy = 40;
            p.va = (Math.random() - 0.5) * 0.6;
          }
          p.sleepT = 0;
        }
      }
      if (sp >= 1) {
        for (i = 0; i < pieces.length; i++) {
          p = pieces[i];
          if (p.st === 'rest' && p.vy < 300) { p.asleep = false; p.sleepT = 0; p.vy += 900 * dt; }
        }
      }
      var keep = [];
      for (i = 0; i < pieces.length; i++) {
        p = pieces[i];
        if (p.y > H + 200) continue;
        keep.push(p);
      }
      var changed = keep.length !== pieces.length;
      pieces = keep;
      if (sp >= 1 && (!pieces.length || now - tState > sweepDur + 4000)) {
        pieces = [];
        base = null;
        baseAlpha = 0;
        mode = 'none';
        openEdge = -1e9;
        floorEl.classList.add('redraw');
        floorEl.style.setProperty('--line', '0');
        void floorEl.offsetWidth;
        floorEl.style.setProperty('--line', '1');
        setTimeout(function () { floorEl.classList.remove('redraw'); }, 650);
        state = 'idle';
        ui();
      } else if (changed) ui();
    }
  }

  function brush(dt) {
    var ddx = ptr.x - ptr.lx, ddy = ptr.y - ptr.ly, psp = Math.sqrt(ddx * ddx + ddy * ddy);
    if (psp < 0.5) return;
    var nst = Math.max(1, Math.ceil(psp / (R * 0.5)));
    var vsx = ddx / Math.max(dt, 0.008) / nst, vsy = ddy / Math.max(dt, 0.008) / nst;
    var rad = Math.min(psp * 14, 260) / nst, lift = 90 * Math.min(psp / 5, 1) / nst;
    for (var si = 1; si <= nst; si++) {
      var bx = ptr.lx + ddx * si / nst, by = ptr.ly + ddy * si / nst;
      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];
        if (p.st !== 'rest') continue;
        var rx = p.x - bx, ry = p.y - by, d2 = rx * rx + ry * ry;
        if (d2 >= R * R) continue;
        var dd = Math.sqrt(d2) || 1, f = 1 - dd / R;
        p.asleep = false;
        p.sleepT = 0;
        p.vx += vsx * 0.5 * f + (rx / dd) * rad * f;
        p.vy += vsy * 0.5 * f + (ry / dd) * rad * f - lift * f;
        var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (sp > 1000) { p.vx *= 1000 / sp; p.vy *= 1000 / sp; }
        p.va += (Math.random() - 0.5) * 3 * f;
      }
    }
  }

  var dirty = true;
  function settled() {
    if (state !== 'idle' || mode !== 'pile') return false;
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      if (p.st !== 'rest' || !p.asleep) return false;
    }
    return true;
  }
  function draw() {
    if (!dirty && settled()) return;
    dirty = false;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingQuality = 'high';
    if (base && baseAlpha > 0) {
      ctx.globalAlpha = baseAlpha;
      ctx.drawImage(base, rect.x, rect.y, rect.w, rect.h);
      ctx.globalAlpha = 1;
    }
    if (mode === 'intact' && state === 'idle') return;
    var list = pieces.slice().sort(function (a, b) { return a.z - b.z; });
    for (var i = 0; i < list.length; i++) {
      var p = list[i], c = Math.cos(p.a), s = Math.sin(p.a);
      ctx.setTransform(dpr * c * p.fs, dpr * s * p.fs, -dpr * s, dpr * c, dpr * p.x, dpr * p.y);
      ctx.drawImage(p.spr, -p.ax, -p.ay, p.sw, p.sh);
    }
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (dt > 0) { update(dt, now); draw(); }
    requestAnimationFrame(frame);
  }

  /* ---------- events ---------- */
  btnS.addEventListener('click', scrap);
  btnR.addEventListener('click', restore);
  btnW.addEventListener('click', sweep);
  btnX.addEventListener('click', function () { fileIn.click(); });
  btnPick.addEventListener('click', function (e) { e.stopPropagation(); fileIn.click(); });
  drop.addEventListener('click', function () { fileIn.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); }
  });
  fileIn.addEventListener('change', function () {
    var f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (state !== 'idle') return;
    loadFile(f);
  });

  var dragDepth = 0;
  stage.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; stage.classList.add('drag'); });
  stage.addEventListener('dragover', function (e) { e.preventDefault(); });
  stage.addEventListener('dragleave', function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) stage.classList.remove('drag');
  });
  stage.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    stage.classList.remove('drag');
    if (state !== 'idle') return;
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    loadFile(f);
  });
  window.addEventListener('paste', function (e) {
    if (state !== 'idle') return;
    var f = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0];
    if (f) loadFile(f);
  });

  function hidePtr() { ptr.on = false; }
  stage.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    if (y > floorY + 4 || x < 0 || x > W) { hidePtr(); return; }
    if (!ptr.on) { ptr.lx = x; ptr.ly = y; }
    ptr.x = x;
    ptr.y = y;
    ptr.on = true;
  });
  stage.addEventListener('pointerleave', hidePtr);
  stage.addEventListener('pointercancel', hidePtr);
  stage.addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') hidePtr(); });

  var rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      resize();
      if (mode === 'intact' || mode === 'mended') {
        if (state === 'idle') {
          var wasMended = mode === 'mended';
          computeRect();
          buildPieces();
          baseAlpha = wasMended ? 0 : 1;
        }
      } else if (mode === 'pile') {
        pieces.forEach(function (p) {
          if (p.x > W - p.r) p.x = W - p.r;
          if (p.st === 'rest') p.asleep = false;
        });
      }
    }, 140);
  });

  resize();
  ui();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
