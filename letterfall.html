<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Letterfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Newsreader:opsz,wght@6..72,300&family=Noto+Serif+Devanagari:wght@300&display=swap">
<style>
/* Layout: one white stage. A quiet header, a wide writing field, and a floor line holding the Collapse button. Letters fall onto that line and pile up. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --serif: 'Newsreader', 'Noto Serif Devanagari', Georgia, 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: #000; color: #fff; }

.stage {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  overflow: hidden;
}
.g {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding-block: 22px 0;
}
.name { font: 300 22px/1 var(--serif); letter-spacing: 0.01em; }
.brand { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; min-width: 0; }
.home {
  font: 300 11px/1 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #000;
  text-decoration: none;
  border-bottom: 1px solid #000;
  padding-bottom: 4px;
}
.home:hover { background: #000; color: #fff; }
.home:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
.hint {
  font: 300 11px/1.4 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: right;
}

.field {
  --top: clamp(32px, 8vh, 96px);
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  cursor: text;
  scrollbar-width: thin;
  scrollbar-color: #000 #fff;
}
.ed {
  box-sizing: border-box;
  max-width: 1040px;
  min-height: 100%;
  margin: 0 auto;
  padding-block: var(--top) 40px;
  outline: none;
  text-align: center;
  font: 300 clamp(22px, 4.4vw, 36px)/1.5 var(--serif);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  caret-color: #000;
}
.ph {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding-top: var(--top);
  text-align: center;
  pointer-events: none;
  font: italic 300 clamp(22px, 4.4vw, 36px)/1.5 var(--serif);
}
.ed:not(:empty) ~ .ph { display: none; }
.stage.busy .ph { opacity: 0; }

.layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: hidden;
}
.l {
  position: absolute;
  left: 0;
  top: 0;
  white-space: pre;
  transform-origin: 50% 50%;
  color: #000;
  user-select: none;
}

.floor {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  min-height: 76px;
  background: var(--paper);
}
.floor::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: #000;
  transform-origin: right center;
  transform: scaleX(var(--line, 1));
}
.floor.redraw::before {
  transform-origin: left center;
  transition: transform 0.55s ease-out;
}
.count {
  min-width: 0;
  font: 300 11px/1.5 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.btn {
  font: 400 12px/1 var(--mono);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: #000;
  color: #fff;
  border: 1px solid #000;
  border-radius: 0;
  padding: 18px 34px;
  min-width: 190px;
  cursor: pointer;
}
.pair { display: flex; justify-content: center; gap: 10px; }
.btn.alt { background: #fff; color: #000; }
.btn.alt:hover:not(:disabled) { background: #000; color: #fff; }
.btn:hover:not(:disabled) { background: #fff; color: #000; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { background: #fff; color: #000; border-style: dashed; cursor: default; }
.ghost {
  justify-self: end;
  font: 300 11px/1 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: none;
  color: #000;
  border: 0;
  border-bottom: 1px solid #000;
  border-radius: 0;
  padding: 6px 0;
  cursor: pointer;
}
.ghost:hover:not(:disabled) { background: #000; color: #fff; }
.ghost:disabled { border-bottom-style: dashed; cursor: default; }
.btn:focus-visible, .ghost:focus-visible { outline: 2px solid #000; outline-offset: 3px; }

@media (max-width: 760px) {
  .floor {
    grid-template-columns: 1fr auto;
    grid-template-areas: "pair pair" "count sweep";
    row-gap: 14px;
    padding-block: 14px;
  }
  .pair { grid-area: pair; }
  .count { grid-area: count; }
  .ghost { grid-area: sweep; }
  .btn { min-width: 0; flex: 1; padding: 16px 18px; }
  .count, .ghost { font-size: 10px; letter-spacing: 0.1em; }
}
@media (max-width: 560px) {
  .hint { display: none; }
}
</style>

</head><body><div class="stage" id="stage">
  <header class="top g">
    <div class="brand"><a class="home" href="index.html">&larr; Welcome</a><span class="name">Letterfall</span></div>
    <div class="hint">Collapse, then brush the pile with your cursor.</div>
  </header>

  <main class="field g" id="field">
    <div class="ed" id="ed" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Writing area">Everything written here is held up by nothing. Type a paragraph, or keep this one, then press collapse and watch each letter let go and fall to the floor.</div>
    <div class="ph" aria-hidden="true">Write here.</div>
  </main>

  <div class="layer" id="layer" aria-hidden="true"></div>

  <footer class="floor g" id="floor">
    <div class="count" id="count" aria-live="polite"></div>
    <div class="pair">
      <button class="btn" id="collapse" type="button" title="Collapse (Ctrl or Cmd + Enter)">Collapse &darr;</button>
      <button class="btn alt" id="reverse" type="button" title="Rewind the last collapse and put the text back">Reverse &uarr;</button>
    </div>
    <button class="ghost" id="sweep" type="button">Sweep away</button>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function () {
  'use strict';
  var M = Matter, Engine = M.Engine, Bodies = M.Bodies, Body = M.Body,
      Composite = M.Composite, Events = M.Events, Sleeping = M.Sleeping;

  var stage = document.getElementById('stage');
  var layer = document.getElementById('layer');
  var field = document.getElementById('field');
  var ed = document.getElementById('ed');
  var btnC = document.getElementById('collapse');
  var btnS = document.getElementById('sweep');
  var btnR = document.getElementById('reverse');
  var sweepDur = 0;
  var R = 64;
  var ptr = { x: 0, y: 0, lx: 0, ly: 0, on: false, touch: false };
  var count = document.getElementById('count');
  var floorEl = document.getElementById('floor');

  var reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var STEP = 1000 / 120, MAXV = 11, PRE = 450, MAX_LETTERS = 2000;
  var engine = Engine.create({ enableSleeping: true });
  engine.gravity.y = 1.8;
  engine.positionIterations = 8;
  engine.velocityIterations = 5;

  var W = 0, H = 0, floorY = 0, floorSegs = [], FSEG = 24, removedSegs = 0, wallL = null, wallR = null;
  var letters = [], pending = [], batch = [];
  var lastBatch = null, lastText = '', rev = [], revT0 = 0;
  var state = 'idle', t0 = 0, lastRelease = 0, sweepT0 = 0;
  var shake = 0, shakeOn = false, acc = 0, last = performance.now(), flashTimer = 0;

  var seg = null;
  try { if (window.Intl && Intl.Segmenter) seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' }); } catch (e) {}

  function buildWorld() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    floorY = H - floorEl.offsetHeight;
    R = W < 560 ? 44 : 64;
    floorSegs.concat([wallL, wallR]).forEach(function (b) { if (b) Composite.remove(engine.world, b); });
    var o = { isStatic: true, friction: 0.9, frictionStatic: 1, restitution: 0.1 };
    var segW = W / FSEG;
    floorSegs = [];
    for (var k = 0; k < FSEG; k++) {
      floorSegs.push(Bodies.rectangle((k + 0.5) * segW, floorY + 200, segW + 2, 400, o));
    }
    wallL = Bodies.rectangle(-200, floorY - 4800, 400, 10000, o);
    wallR = Bodies.rectangle(W + 200, floorY - 4800, 400, 10000, o);
    Composite.add(engine.world, [wallL, wallR]);
    for (k = removedSegs; k < FSEG; k++) Composite.add(engine.world, floorSegs[k]);
  }

  function ui() {
    btnC.disabled = state !== 'idle';
    btnS.disabled = state !== 'idle' || !letters.length;
    btnR.disabled = state !== 'idle' || !lastBatch || !lastBatch.length;
    if (flashTimer) return;
    var n = letters.length;
    if (state === 'pre' || state === 'falling') count.textContent = 'Collapsing';
    else if (state === 'sweeping') count.textContent = 'Sweeping';
    else if (state === 'reversing') count.textContent = 'Rewinding';
    else count.textContent = n ? n + (n === 1 ? ' letter resting' : ' letters resting') : 'Nothing resting';
  }
  function flash(msg) {
    count.textContent = msg;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { flashTimer = 0; ui(); }, 1800);
  }

  function place(L, jx, jy) {
    var b = L.body;
    L.el.style.transform = 'translate(' + (b.position.x - L.w / 2 + (jx || 0)).toFixed(2) + 'px,' +
      (b.position.y - L.h / 2 + (jy || 0)).toFixed(2) + 'px) rotate(' + b.angle.toFixed(4) + 'rad)';
  }

  function measure() {
    var items = [];
    var origin = layer.getBoundingClientRect();
    var view = field.getBoundingClientRect();
    var walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    var range = document.createRange();
    var node;
    while ((node = walker.nextNode())) {
      var text = node.nodeValue;
      if (!text || !text.trim()) continue;
      var parts = [];
      if (seg) {
        var it = seg.segment(text)[Symbol.iterator](), nx;
        while (!(nx = it.next()).done) parts.push({ s: nx.value.segment, i: nx.value.index });
      } else {
        var idx = 0;
        Array.from(text).forEach(function (ch) { parts.push({ s: ch, i: idx }); idx += ch.length; });
      }
      for (var k = 0; k < parts.length; k++) {
        var p = parts[k];
        if (!p.s.trim()) continue;
        range.setStart(node, p.i);
        range.setEnd(node, p.i + p.s.length);
        var r = range.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) continue;
        items.push({
          ch: p.s, x: r.left - origin.left, y: r.top - origin.top, w: r.width, h: r.height,
          vis: r.bottom > view.top && r.top < view.bottom
        });
        if (items.length >= MAX_LETTERS) return items;
      }
    }
    return items;
  }

  function collapse() {
    if (state !== 'idle') return;
    stage.style.transform = '';
    shake = 0; shakeOn = false;
    var items = measure();
    if (!items.length) { flash('Write something first'); ed.focus(); return; }

    var cs = getComputedStyle(ed);
    layer.style.fontFamily = cs.fontFamily;
    layer.style.fontSize = cs.fontSize;
    layer.style.fontWeight = cs.fontWeight;
    layer.style.letterSpacing = cs.letterSpacing;

    var minY = Infinity, maxY = -Infinity;
    items.forEach(function (it) {
      if (!it.vis) return;
      var cy = it.y + it.h * 0.49;
      if (cy < minY) minY = cy;
      if (cy > maxY) maxY = cy;
    });
    var span = Math.max(maxY - minY, 1);

    var frag = document.createDocumentFragment();
    var now = performance.now();
    t0 = now;
    batch = [];
    items.forEach(function (it) {
      var w = Math.max(it.w, 2), h = Math.max(it.h, 8);
      var cx = it.x + w / 2, cy = it.y + h * 0.49, delay;
      if (it.vis) {
        delay = ((maxY - cy) / span) * 1100 + (cx / Math.max(W, 1)) * 260 + Math.random() * 180;
      } else {
        cy = -60 - Math.random() * 700;
        delay = 1200 + Math.random() * 900;
      }
      var bw = Math.max(w * 0.9, 3), bh = h * 0.7;
      var opts = { restitution: 0.22, friction: 0.7, frictionStatic: 1, frictionAir: 0.004, density: 0.002, slop: 0.04 };
      if (bw > 7) opts.chamfer = { radius: Math.min(2, bw * 0.2, bh * 0.2) };
      var body = Bodies.rectangle(cx, cy, bw, bh, opts);
      var el = document.createElement('span');
      el.className = 'l';
      el.textContent = it.ch;
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      el.style.lineHeight = h + 'px';
      var L = { body: body, el: el, w: w, h: h, releaseAt: t0 + PRE + delay, released: false, drawn: false };
      place(L);
      frag.appendChild(el);
      letters.push(L);
      batch.push(L);
      pending.push(L);
    });
    pending.sort(function (a, b) { return a.releaseAt - b.releaseAt; });
    layer.appendChild(frag);
    lastText = (ed.innerText || ed.textContent || '').replace(/\s+$/, '');
    lastBatch = batch.slice();
    ed.textContent = '';

    state = 'pre';
    stage.classList.add('busy');
    ui();
  }

  function release(L) {
    L.released = true;
    Body.setVelocity(L.body, { x: (Math.random() - 0.5) * 1.6, y: Math.random() * 0.5 });
    Body.setAngularVelocity(L.body, (Math.random() - 0.5) * 0.07);
    Composite.add(engine.world, L.body);
  }

  function dropLetter(L) {
    Composite.remove(engine.world, L.body);
    if (L.el.parentNode) L.el.parentNode.removeChild(L.el);
  }

  function sweep() {
    if (state !== 'idle' || !letters.length) return;
    state = 'sweeping';
    lastBatch = null;
    sweepT0 = performance.now();
    sweepDur = Math.max(1400, Math.min(2800, W * 1.4));
    removedSegs = 0;
    floorEl.classList.remove('redraw');
    ui();
  }

  function ease(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }

  function reverse() {
    if (state !== 'idle' || !lastBatch || !lastBatch.length) return;
    if (ed.textContent.trim()) { flash('Clear the writing area first'); return; }
    stage.style.transform = '';
    shake = 0; shakeOn = false;
    ed.textContent = lastText;
    ed.style.visibility = 'hidden';
    var items = measure();
    var n = Math.min(items.length, lastBatch.length);
    if (!n) { ed.textContent = ''; ed.style.visibility = ''; flash('Nothing to rewind'); return; }
    var group = lastBatch.slice(0, n);
    var minY = Infinity, maxY = -Infinity;
    group.forEach(function (L, i) {
      L.tx = items[i].x + L.w / 2;
      L.ty = items[i].y + L.h * 0.49;
      if (L.ty < minY) minY = L.ty;
      if (L.ty > maxY) maxY = L.ty;
    });
    var span = Math.max(maxY - minY, 1);
    group.forEach(function (L) {
      Composite.remove(engine.world, L.body);
      L.rv = true;
      L.sx = L.body.position.x;
      L.sy = L.body.position.y;
      var a = L.body.angle % (2 * Math.PI);
      if (a > Math.PI) a -= 2 * Math.PI;
      if (a < -Math.PI) a += 2 * Math.PI;
      L.sa = a;
      var dx = L.tx - L.sx, dy = L.ty - L.sy, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var arc = (Math.random() - 0.5) * Math.min(160, len * 0.5);
      L.px = -dy / len * arc;
      L.py = dx / len * arc;
      L.rd = ((L.ty - minY) / span) * 800 + Math.random() * 160;
      L.rdur = 900 + Math.random() * 300;
    });
    letters = letters.filter(function (L) { return !L.rv; });
    letters.forEach(function (L) { Sleeping.set(L.body, false); L.drawn = false; });
    rev = group;
    revT0 = performance.now();
    lastBatch = null;
    state = 'reversing';
    stage.classList.add('busy');
    ui();
  }

  Events.on(engine, 'collisionStart', function (e) {
    var s = 0;
    for (var i = 0; i < e.pairs.length; i++) {
      var a = e.pairs[i].bodyA.velocity, b = e.pairs[i].bodyB.velocity;
      var v = Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
      if (v > 3) s += v * 0.004;
    }
    if (s > 0 && !reduce) shake = Math.min(shake + s, 5);
  });

  function frame(now) {
    var dt = Math.min(now - last, 60);
    last = now;
    var i, L;

    if (state === 'pre') {
      var p = Math.min((now - t0) / PRE, 1);
      if (!reduce) shake = Math.max(shake, 0.4 + 2.6 * p);
      for (i = 0; i < batch.length; i++) place(batch[i], (Math.random() - 0.5) * 2.4 * p, (Math.random() - 0.5) * 1.6 * p);
      if (p >= 1) {
        for (i = 0; i < batch.length; i++) place(batch[i]);
        batch = [];
        state = 'falling';
      }
    }

    if (state === 'reversing') {
      var rtm = now - revT0, allDone = true;
      for (i = 0; i < rev.length; i++) {
        L = rev[i];
        var u = (rtm - L.rd) / L.rdur;
        if (u < 1) allDone = false;
        if (u <= 0) continue;
        var e = ease(Math.min(u, 1)), s = Math.sin(Math.PI * e);
        var x = L.sx + (L.tx - L.sx) * e + L.px * s;
        var y = L.sy + (L.ty - L.sy) * e + L.py * s;
        L.el.style.transform = 'translate(' + (x - L.w / 2).toFixed(2) + 'px,' + (y - L.h / 2).toFixed(2) +
          'px) rotate(' + (L.sa * (1 - e)).toFixed(4) + 'rad)';
      }
      if (allDone) {
        for (i = 0; i < rev.length; i++) {
          if (rev[i].el.parentNode) rev[i].el.parentNode.removeChild(rev[i].el);
        }
        rev = [];
        ed.style.visibility = '';
        stage.classList.remove('busy');
        state = 'idle';
        ui();
        if (!('ontouchstart' in window)) ed.focus();
      }
    }

    while (pending.length && pending[0].releaseAt <= now && state !== 'pre') {
      release(pending.shift());
      lastRelease = now;
    }

    if (ptr.on && letters.length) {
      var ddx = ptr.x - ptr.lx, ddy = ptr.y - ptr.ly, psp = Math.sqrt(ddx * ddx + ddy * ddy);
      if (psp > 0.5) {
        var kk = STEP / Math.max(dt, 8), nst = Math.max(1, Math.ceil(psp / (R * 0.5)));
        var vsx = ddx * kk / nst, vsy = ddy * kk / nst;
        var rad = Math.min(psp * 0.12, 2.2) / nst;
        var lift = 0.25 * Math.min(psp / 5, 1) / nst;
        for (var si = 1; si <= nst; si++) {
          var bx = ptr.lx + ddx * si / nst, by = ptr.ly + ddy * si / nst;
          for (i = 0; i < letters.length; i++) {
            L = letters[i];
            if (!L.released) continue;
            var bb = L.body;
            var rx = bb.position.x - bx, ry = bb.position.y - by, d2 = rx * rx + ry * ry;
            if (d2 >= R * R) continue;
            var dd = Math.sqrt(d2) || 1, f = 1 - dd / R;
            if (bb.isSleeping) Sleeping.set(bb, false);
            Body.setVelocity(bb, {
              x: bb.velocity.x + vsx * 0.5 * f + (rx / dd) * rad * f,
              y: bb.velocity.y + vsy * 0.5 * f + (ry / dd) * rad * f - lift * f
            });
            Body.setAngularVelocity(bb, bb.angularVelocity + (Math.random() - 0.5) * 0.05 * f);
            L.drawn = false;
          }
        }
      }
    }
    ptr.lx = ptr.x;
    ptr.ly = ptr.y;

    acc += dt;
    var n = 0;
    while (acc >= STEP && n < 4) { Engine.update(engine, STEP); acc -= STEP; n++; }
    if (acc > STEP) acc = 0;

    for (i = 0; i < letters.length; i++) {
      L = letters[i];
      if (!L.released) continue;
      var b = L.body;
      if (!b.isSleeping) {
        var vx = b.velocity.x, vy = b.velocity.y, sp = Math.sqrt(vx * vx + vy * vy);
        if (sp > MAXV) Body.setVelocity(b, { x: vx * MAXV / sp, y: vy * MAXV / sp });
        L.drawn = false;
        place(L);
      } else if (!L.drawn) {
        L.drawn = true;
        place(L);
      }
    }

    if (state === 'falling' && !pending.length && now - lastRelease > 500) {
      state = 'idle';
      stage.classList.remove('busy');
      ui();
    }

    if (state === 'sweeping') {
      var sp0 = Math.min((now - sweepT0) / sweepDur, 1);
      floorEl.style.setProperty('--line', (1 - sp0).toFixed(4));
      var segW = W / FSEG;
      var target = sp0 >= 1 ? FSEG : Math.floor(sp0 * W / segW);
      while (removedSegs < target) {
        Composite.remove(engine.world, floorSegs[removedSegs]);
        removedSegs++;
      }
      var open = removedSegs * segW + segW;
      for (i = 0; i < letters.length; i++) {
        L = letters[i];
        var bp = L.body;
        if (bp.position.x < open && bp.isSleeping) {
          Sleeping.set(bp, false);
          Body.setAngularVelocity(bp, (Math.random() - 0.5) * 0.1);
          L.drawn = false;
        }
      }
      var keep = [];
      for (i = 0; i < letters.length; i++) {
        L = letters[i];
        if (L.body.position.y > H + 250) dropLetter(L); else keep.push(L);
      }
      var changed = keep.length !== letters.length;
      letters = keep;
      if (sp0 >= 1 && (!letters.length || now - sweepT0 > sweepDur + 3000)) {
        letters.forEach(dropLetter);
        letters = [];
        removedSegs = 0;
        floorSegs.forEach(function (b) { Composite.add(engine.world, b); });
        floorEl.classList.add('redraw');
        floorEl.style.setProperty('--line', '0');
        void floorEl.offsetWidth;
        floorEl.style.setProperty('--line', '1');
        setTimeout(function () { floorEl.classList.remove('redraw'); }, 650);
        state = 'idle';
        ui();
      } else if (changed) ui();
    }

    if (shake > 0.12 && !reduce) {
      stage.style.transform = 'translate(' + ((Math.random() - 0.5) * 2 * shake).toFixed(2) + 'px,' +
        ((Math.random() - 0.5) * 2 * shake).toFixed(2) + 'px)';
      shakeOn = true;
      shake *= 0.9;
    } else if (shakeOn) {
      stage.style.transform = '';
      shake = 0;
      shakeOn = false;
    }

    requestAnimationFrame(frame);
  }

  ed.addEventListener('input', function () {
    if (!ed.textContent.length && ed.innerHTML) ed.innerHTML = '';
  });
  ed.addEventListener('paste', function (e) {
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData('text') || '';
    var ok = false;
    try { ok = document.execCommand('insertText', false, t); } catch (err) {}
    if (!ok) {
      var sel = window.getSelection();
      if (sel && sel.rangeCount) {
        var r = sel.getRangeAt(0);
        r.deleteContents();
        var tn = document.createTextNode(t);
        r.insertNode(tn);
        r.setStartAfter(tn);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      }
    }
  });
  ed.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); collapse(); }
  });
  field.addEventListener('click', function (e) { if (e.target === field) ed.focus(); });
  btnC.addEventListener('click', collapse);
  btnS.addEventListener('click', sweep);
  btnR.addEventListener('click', reverse);

  function hideBrush() { ptr.on = false; }
  stage.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    if (y > floorY + 4 || x < 0 || x > W) { hideBrush(); return; }
    if (!ptr.on) { ptr.lx = x; ptr.ly = y; }
    ptr.x = x; ptr.y = y; ptr.on = true;
    ptr.touch = e.pointerType === 'touch';
  });
  stage.addEventListener('pointerleave', hideBrush);
  stage.addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') hideBrush(); });
  stage.addEventListener('pointercancel', hideBrush);

  var rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      buildWorld();
      letters.forEach(function (L) {
        if (L.released && L.body.position.x > W - 4) Body.setPosition(L.body, { x: W - 8, y: L.body.position.y });
        Sleeping.set(L.body, false);
        L.drawn = false;
      });
    }, 120);
  });

  buildWorld();
  ui();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
